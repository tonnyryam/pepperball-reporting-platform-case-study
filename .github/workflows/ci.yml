name: Public artifact checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: python -m pip install pypdf
      - run: python -m unittest discover -s tests -v
      - run: python demo/run_demo.py --json
      # Current publication gate. Historical exposure is reviewed separately;
      # this correction does not rewrite existing public Git history.
      - run: python scripts/public_safety_scan.py --skip-history
      - run: npm run lint
      - run: npm run build
