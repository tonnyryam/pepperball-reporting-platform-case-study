[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-reporting-demo"
version = "0.1.0"
description = "Synthetic teaching model for deterministic reporting and bounded recovery"
requires-python = ">=3.11"
authors = [{name = "Thomas Ryan"}]
license = {text = "All rights reserved pending final license selection"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
